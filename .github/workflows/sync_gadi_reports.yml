name: Sync MOPPy reports from Gadi

on:
  schedule:
    # 14:23 UTC == 00:23 Australia/Brisbane (AEST, UTC+10, no daylight saving).
    # Deliberately off the hour boundary: GitHub drops or delays scheduled
    # events under load, and the top of the hour is the most contended slot.
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rsync and report what would change, without committing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-gadi-reports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Preflight - validate DEPLOY_KEY and Gadi access
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GADI_USER: ${{ secrets.GADI_USER }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_KEY secret is empty or not set." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/gadi_key
          chmod 600 ~/.ssh/gadi_key

          # A secret pasted without its BEGIN/END lines, and a key that is
          # simply not installed on Gadi, both surface as the same opaque
          # "Permission denied (publickey)". Separate the cases here, before
          # the transfer step, so the log names the actual problem.
          if ! ssh-keygen -y -f ~/.ssh/gadi_key < /dev/null > /dev/null 2>&1; then
            echo "::error::DEPLOY_KEY is not a usable private key: it is either passphrase-protected, or was truncated when pasted into the secret. The secret must hold the whole file, BEGIN and END lines included." >&2
            exit 1
          fi

          echo "Runner key fingerprint:"
          ssh-keygen -l -f ~/.ssh/gadi_key
          echo "This must appear in ~/.ssh/authorized_keys on Gadi. Compare with:"
          echo "  ssh-keygen -l -f <your-key>.pub"

          if ssh -i ~/.ssh/gadi_key -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new \
              "${GADI_USER}@gadi.nci.org.au" true; then
            echo "Authenticated to Gadi as ${GADI_USER}."
            exit 0
          fi

          echo "::error::Could not authenticate to Gadi. Verbose log follows." >&2
          ssh -v -i ~/.ssh/gadi_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${GADI_USER}@gadi.nci.org.au" true || true
          exit 1

      - name: List published output on Gadi
        # NCI moves approved output from admin/incoming/ to publications/, so
        # anything there is published. Only the directories holding files are
        # needed, not the files themselves. pipefail keeps a failed listing from
        # passing as an empty one, which would unpublish every variable.
        env:
          GADI_USER: ${{ secrets.GADI_USER }}
          PUBLICATIONS: ${{ vars.GADI_PUBLICATIONS_PATH || '/g/data/im55/publications' }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/gadi_key -o BatchMode=yes -o ConnectTimeout=20 \
            "${GADI_USER}@gadi.nci.org.au" \
            "set -o pipefail; cd '${PUBLICATIONS}' && find MIP-DRS7 -name '*.nc' -printf '%h\\n' | sort -u" \
            > published.txt
          echo "$(grep -c '^MIP-DRS7/' published.txt || true) published version directories."

      - name: Rsync reports from Gadi
        # Matches the transfer pattern used across ACCESS-Analysis-Conda, in
        # pull mode. The action assembles its rsync command as a string and
        # runs it through eval, so each filter carries its own quotes to keep
        # the pattern literal. Defensive rather than load-bearing: the glob is
        # the whole word (--exclude=*), so it only expands if the working
        # directory happens to hold a file named --exclude=<something>.
        # MIP-DRS7/ (the CMORised output) and logs/ never hold reports; skipping
        # them spares rsync a walk of every output directory on /g/data.
        uses: up9cloud/action-rsync@v1.3
        env:
          MODE: pull
          HOST: gadi.nci.org.au
          USER: ${{ secrets.GADI_USER }}
          KEY: ${{ secrets.DEPLOY_KEY }}
          SOURCE: ${{ vars.GADI_INCOMING_PATH || '/g/data/im55/admin/incoming/' }}
          TARGET: ./incoming/
          ARGS: >-
            -av --prune-empty-dirs
            --exclude='MIP-DRS7/'
            --exclude='logs/'
            --include='*/'
            --include='batch_config.yml'
            --include='moppy_batch_report_*.json'
            --exclude='*'

      - name: Ingest publication status into progress/
        # Before the reports: a member with a publication.json keeps its last
        # report when it is no longer in the current delivery.
        run: |
          python scripts/sync_publications.py \
            --listing published.txt \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Ingest reports into progress/
        run: |
          python scripts/sync_reports.py \
            --source incoming \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Compile progress (check ingested records)
        run: python scripts/compile_progress.py --output /tmp/progress.json

      - name: Commit and push changes
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain progress/)" ]; then
            echo "No progress changes detected; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress/
          git commit -m "chore(progress): sync MOPPy reports from Gadi"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild and deploy dashboard
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build_dashboard.yml --ref main
